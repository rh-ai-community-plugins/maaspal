name: model_health_check
description: >-
  Read-only model health check — confirms the TokenRateLimitPolicy's
  Accepted/Enforced conditions, the MaaS gateway's Programmed condition, and
  the target model's HTTPRoute ownership all reflect real, healthy state
  rather than trusting the MaaS Setup UI's display of the same resources at
  face value. No writes, no keys provisioned, no traffic sent — scoped to
  internally-hosted (LLMInferenceService-backed) models.
category: "Platform Health"
config:
  target_model_name: ""       # required — the MaaSModelRef's own name, e.g. "facebook-opt-125m-simulated" (not the plain model id)
  target_model_namespace: ""  # required — the namespace that MaaSModelRef lives in, e.g. "llm"
  # Confirmed live (this cluster) — the Gateway MaaS's own HTTPRoutes
  # actually reference; a second, unrelated Gateway (data-science-gateway)
  # also lives in this namespace, so don't assume there's only one.
  gateway_name: "maas-default-gateway"
  gateway_namespace: "openshift-ingress"
tasks:
  - name: check_model_health
    params:
      model_name: "${config.target_model_name}"
      model_namespace: "${config.target_model_namespace}"
      gateway_name: "${config.gateway_name}"
      gateway_namespace: "${config.gateway_namespace}"
    # promql pass-through form (ADR-015) — see single_key_load.yaml. These
    # are all REST/CR-read flags (0/1), not real Prometheus metrics, routed
    # through the same mechanism as every other harness-side check in this
    # codebase for parsing-path coverage.
    assertions:
      rate_limit_policy_accepted:
        promql: "${harness.rate_limit_policy_status.accepted}"
        expect: "== 1"
      rate_limit_policy_enforced:
        promql: "${harness.rate_limit_policy_status.enforced}"
        expect: "== 1"
      gateway_programmed:
        promql: "${harness.gateway_status.programmed}"
        expect: "== 1"
      http_route_owner_matches:
        promql: "${harness.http_route_status.owner_ref_matches}"
        expect: "== 1"
cleanup: automatic
