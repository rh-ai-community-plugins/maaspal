name: rate_limit_shared_across_users
description: >-
  Empirically checks whether two distinct caller identities sharing one
  MaaSSubscription get one pooled token-rate-limit allowance or independent
  per-user allowances. ASSERTION FAILURE on error_rate_pct_user_b HERE IS THE
  FINDING ("limits are shared"), not necessarily a harness bug — see ADR-023.
category: "Rate Limiting"
config:
  new_subscription_name: "maaspal-shared-pool-test"
  subscription_namespace: "models-as-a-service"  # install-specific tenant namespace; override if yours differs
  target_model_name: ""       # required — the MaaSModelRef's own name
  target_model_namespace: ""  # required — the namespace that MaaSModelRef lives in
  # Deliberately tight: one user's own burst alone should mostly succeed,
  # but both users' combined usage would exceed this if the allowance were
  # pooled rather than per-user. Tune against request_count/prompt size once
  # run live — see ADR-023's Verification notes.
  token_limit: 200
  # Deliberately long relative to the scenario's own runtime (two users
  # minted, subscription applied and awaited-ready, two sequential bursts) —
  # a short window (e.g. the "1s" other rate-limit scenarios use) risks
  # resetting between user A's and user B's bursts, which would make a
  # "not rate-limited" result meaningless (the window reset, not a per-user
  # allowance, is what actually let user B through). 10 minutes comfortably
  # outlasts the whole run so both bursts land in the same window.
  token_window: "10m"
  request_count: 20
  concurrency: 5
  prompt: "Hello, world!"
tasks:
  - name: create_user
    params:
      count: 2
      name_prefix: "maaspal-pool-user"
  - name: apply_rate_limit_subscription
    params:
      new_subscription_name: "${config.new_subscription_name}"
      namespace: "${config.subscription_namespace}"
      model_name: "${config.target_model_name}"
      model_namespace: "${config.target_model_namespace}"
      token_limit: "${config.token_limit}"
      token_window: "${config.token_window}"
      # Narrow blast radius on purpose (ADR-023) — an explicit empty list
      # now sticks (see harness/tasks/subscription.py's owner_groups fix)
      # instead of silently falling back to system:authenticated, which
      # would let any other caller on the cluster share this quota too.
      owner_groups: []
      owner_users_from_shared_state: "users"
  - name: provision_keys_for_users
    params:
      key_name_prefix: "maaspal-pool-key"
      subscription: "${config.new_subscription_name}"
    # REST-only check (ADR-019 pattern): the create response actually
    # echoes the shared subscription for both users' keys.
    assertions:
      subscription_echo_match_count:
        promql: "${harness.key_provision_checks.subscription_echo_match_count}"
        expect: "== 2"
  - name: send_requests
    params:
      # Confirmed live elsewhere (send_requests's own model-discovery
      # comment): always pin the exact model this scenario's subscription
      # targets, don't rely on DEFAULT_MODEL/first-available.
      model: "${config.target_model_namespace}/${config.target_model_name}"
      count: "${config.request_count}"
      concurrency: "${config.concurrency}"
      prompt: "${config.prompt}"
      key_index: 0
      result_key: "inference_results_user_a"
    # User A goes first, against a fresh quota — should mostly succeed
    # regardless of whether the limit is shared or per-user.
    assertions:
      error_rate_pct_user_a:
        promql: "${harness.inference_results_user_a.error_rate_pct}"
        expect: "< 20"
  - name: send_requests_as_second_user
    params:
      model: "${config.target_model_namespace}/${config.target_model_name}"
      count: "${config.request_count}"
      concurrency: "${config.concurrency}"
      prompt: "${config.prompt}"
      key_index: 1
      result_key: "inference_results_user_b"
    # User B goes immediately after, on their OWN key but the SAME
    # subscription. Encodes the "independent per-user allowance" hypothesis
    # (see docs/architecture/empirical-verification-checklist.md's
    # counters: [{expression: auth.identity.userid}] observation) as the
    # expected outcome. A FAIL here — user B getting rate-limited because
    # user A already consumed the "shared" quota — is the actual empirical
    # finding this scenario exists to surface, not a sign the harness is
    # broken. See ADR-023 for how to interpret either result.
    assertions:
      error_rate_pct_user_b:
        promql: "${harness.inference_results_user_b.error_rate_pct}"
        expect: "< 20"
cleanup: automatic
