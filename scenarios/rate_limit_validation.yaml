name: rate_limit_validation
description: "Rate-limit validation — applies a MaaSSubscription CR (per-model token rate limit) and asserts observed token throughput stays at or below it"
category: "Rate Limiting"
config:
  new_subscription_name: "maaspal-rate-limit-test"
  subscription_namespace: "models-as-a-service"  # install-specific tenant namespace; override if yours differs
  target_model_name: ""       # required — the MaaSModelRef's own name, e.g. "facebook-opt-125m-simulated" (not the plain model id)
  target_model_namespace: ""  # required — the namespace that MaaSModelRef lives in, e.g. "llm"
  token_limit: 50             # tokens/sec — see harness/tasks/subscription.py for why the window defaults to 1s to make this directly comparable
  request_count: 100
  concurrency: 20
  key_count: 1
  prompt: "Hello, world!"
  # Limitador's gateway counters are scoped by the target model's HTTPRoute name
  # (ADR-014) — same convention as scenarios/metrics_fill.yaml.
  limitador_namespace: "llm/facebook-opt-125m-simulated-kserve-route"
  # Max wait for a fresh Prometheus scrape before settling maas_denied_by_rate_limit (ADR-014).
  metrics_max_wait_s: 65
# Named PromQL query (ADR-015), baseline-snapshotted before the task loop and
# re-polled every 5s. Referenced below via ${baseline.limited_calls}.
metrics_queries:
  limited_calls: 'sum(limited_calls{limitador_namespace="${config.limitador_namespace}"})'
tasks:
  - name: apply_rate_limit_subscription
    params:
      new_subscription_name: "${config.new_subscription_name}"
      namespace: "${config.subscription_namespace}"
      model_name: "${config.target_model_name}"
      model_namespace: "${config.target_model_namespace}"
      token_limit: "${config.token_limit}"
  - name: provision_api_key
    params:
      key_name: "maaspal-rate-key"
      count: "${config.key_count}"
      subscription: "${config.new_subscription_name}"
    # REST-only check (ADR-019): the create response actually echoes the
    # subscription we asked for, rather than silently auto-selecting a
    # different eligible one — this scenario already needs the subscription
    # param for its own purpose, so this closes the checklist row at no
    # added CR-coupling.
    assertions:
      subscription_echo_match_count:
        promql: "${harness.key_provision_checks.subscription_echo_match_count}"
        expect: "== ${config.key_count}"
  - name: send_requests
    params:
      # Confirmed live: /v1/models can return more than one model (an
      # unrelated ExternalModel silently hijacked this scenario once by
      # sorting first in the discovery response) — always pin the exact
      # model this scenario's subscription targets, don't rely on
      # DEFAULT_MODEL/first-available. Matches m['owned_by'] ("<namespace>/
      # <name>"), the one discovery field that's a reliable match for these
      # two config values regardless of id/displayName formatting.
      model: "${config.target_model_namespace}/${config.target_model_name}"
      count: "${config.request_count}"
      concurrency: "${config.concurrency}"
      prompt: "${config.prompt}"
      key_pool: true
    # promql pass-through form (ADR-015) — see single_key_load.yaml.
    assertions:
      token_throughput_per_sec:
        promql: "${harness.inference_results.token_throughput_per_sec}"
        expect: "<= ${config.token_limit}"
      error_rate_pct:
        promql: "${harness.inference_results.error_rate_pct}"
        expect: "< 30"
      # Cross-checks that Limitador itself actually denied requests once the
      # configured token_limit was exceeded — not just that the harness's own
      # client-side throughput math stayed under budget (ADR-015's flagged gap:
      # this scenario's other assertions never verified real enforcement).
      maas_denied_by_rate_limit:
        promql: >-
          sum(limited_calls{limitador_namespace="${config.limitador_namespace}"})
          - ${baseline.limited_calls}
        expect: "> 0"
        max_wait_s: "${config.metrics_max_wait_s}"
cleanup: automatic
