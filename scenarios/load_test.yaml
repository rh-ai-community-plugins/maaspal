name: load_test
previous_names: [single_key_load, multi_key_load]
title: "How does MaaS hold up under load?"
summary: >-
  Steps up concurrent traffic through MaaS and shows where latency or errors
  start to climb — telling throttling by your subscription apart from real failures.
description: >-
  Creates one or more API keys and sends continuous traffic through the MaaS
  gateway in steps of rising concurrency (5, then 10, 25 and 50 requests in
  flight by default, 30 s each). For each step it reports throughput,
  latency and errors, so you can see where things start to struggle rather
  than one averaged number. Throttling (429) by your subscription's own limit
  is reported separately from genuine errors. Pass/fail is judged at the
  heaviest step.
category: "Performance"
kind: verify
mutates: [api_keys]
est_duration: "~2–3 min"
plan_template: >-
  Create ${config.key_count} API key(s) on ${subscription}, then send to ${model} with
  ${config.concurrency_steps} requests in flight, ${config.step_duration_s}s per step.
inputs:
  target_model_name: {label: "Model"}
  concurrency_steps:
    label: "Concurrency steps"
    help: >-
      How many requests to keep in flight at each step, comma-separated, e.g.
      "5, 10, 25, 50". Each step runs for the step duration below.
  step_duration_s:
    label: "Step duration (s)"
    help: "How long each step runs, in seconds."
  key_count:
    label: "API keys"
    help: "Requests are spread evenly across the keys."
  max_error_rate_pct:
    label: "Max error rate at the top step (%)"
    help: >-
      Highest acceptable share of failed requests at the heaviest step, not
      counting 429s (throttling by your subscription is reported separately).
  max_p99_latency_ms:
    label: "Max p99 latency at the top step (ms)"
    help: "99% of requests at the heaviest step must finish faster than this."
  prompt:
    advanced: true
    help: "The chat message sent in every request."
  subscription:
    help: "Leave on auto-select to let MaaS pick, as it would for a real user (highest-priority subscription you're eligible for)."
config:
  concurrency_steps: "5, 10, 25, 50"
  step_duration_s: 30
  key_count: 1
  max_error_rate_pct: 5
  max_p99_latency_ms: 10000
  prompt: "Hello, world!"
  subscription: ""           # optional — leave blank for auto-selection
  target_model_name: ""      # optional — blank uses DEFAULT_MODEL
  target_model_namespace: ""
verdict:
  pass: >-
    MaaS held up through every step: at the heaviest step, p99 was
    ${harness.inference_results.final_stage_p99_latency_ms} ms with
    ${harness.inference_results.final_stage_error_rate_pct}% errors.
  fail: >-
    At the heaviest step MaaS missed the targets — p99
    ${harness.inference_results.final_stage_p99_latency_ms} ms,
    ${harness.inference_results.final_stage_error_rate_pct}% errors. The step table shows where it started.
tasks:
  - name: provision_api_key
    params:
      key_name: "maaspal-load-key"
      count: "${config.key_count}"
      subscription: "${config.subscription}"
  - name: send_requests
    params:
      stages: "${config.concurrency_steps}"
      stage_duration_s: "${config.step_duration_s}"
      prompt: "${config.prompt}"
      model: "${config.target_model_namespace}/${config.target_model_name}"
      key_pool: true
    assertions:
      final_stage_error_rate_pct:
        label: "Error rate at the heaviest step (excluding throttling)"
        description: "Failures other than 429s — 401/403s, 404s, 5xx, timeouts."
        unit: "%"
        promql: "${harness.inference_results.final_stage_error_rate_pct}"
        expect: "< ${config.max_error_rate_pct}"
      final_stage_p99_latency_ms:
        label: "p99 latency at the heaviest step"
        unit: "ms"
        promql: "${harness.inference_results.final_stage_p99_latency_ms}"
        expect: "< ${config.max_p99_latency_ms}"
cleanup: automatic
