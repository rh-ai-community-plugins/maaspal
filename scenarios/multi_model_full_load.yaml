name: multi_model_full_load
description: "Deploy N models, M subscriptions distributed across them, K API keys across subscriptions, R requests across keys"
category: "Load Testing"
config:
  model_count: 3
  model_name_prefix: "maaspal-sim"
  model_namespace: "maaspal"
  subscription_count: 6
  subscription_name_prefix: "maaspal-dist-sub"
  subscription_namespace: "models-as-a-service"
  max_models_per_subscription: 0   # 0 = no cap
  token_limit: 1000000
  model_ready_timeout: 120         # seconds to wait for each model to become Ready
  deploy_parallel: true            # true = deploy all models concurrently; false = one at a time
  # Confirmed live: creating several subscriptions that share models races
  # the controller reconciling each shared model's TokenRateLimitPolicy
  # ("the object has been modified" conflicts) — this is how long to wait
  # for every referenced model's policy to actually report Accepted+Enforced
  # before moving on, not just for the subscription's own status.phase to be
  # set (see harness/tasks/subscription.py's
  # _wait_for_token_rate_limit_policies_ready).
  token_rate_limit_ready_timeout: 60
  api_key_count: 12
  request_count: 60
  concurrency: 10
  prompt: "Hello, world!"
tasks:
  - name: deploy_simulated_model
    params:
      count: "${config.model_count}"
      name_prefix: "${config.model_name_prefix}"
      namespace: "${config.model_namespace}"
      ready_max_wait_s: "${config.model_ready_timeout}"
      parallel: "${config.deploy_parallel}"
  - name: apply_auth_policy
    params:
      # A MaaSSubscription only grants quota — gateway access is a separate
      # MaaSAuthPolicy, and provision_subscriptions_distributed never
      # creates one. Confirmed live: without this, every request to a
      # freshly-deployed model is denied regardless of subscription/quota,
      # matching what scenarios/subscription_without_authpolicy.yaml tests
      # deliberately — this scenario needs the opposite (real access), so it
      # grants the same owner_groups default subscriptions use.
      policy_name: "maaspal-dist-policy"
      namespace: "${config.subscription_namespace}"
      model_refs_from_shared_state: "deployed_models"
      subject_groups: ["system:authenticated"]
  - name: provision_subscriptions_distributed
    params:
      subscription_count: "${config.subscription_count}"
      name_prefix: "${config.subscription_name_prefix}"
      namespace: "${config.subscription_namespace}"
      max_models_per_subscription: "${config.max_models_per_subscription}"
      token_limit: "${config.token_limit}"
      token_rate_limit_ready_max_wait_s: "${config.token_rate_limit_ready_timeout}"
  - name: provision_keys_distributed
    params:
      key_count: "${config.api_key_count}"
      key_name_prefix: "maaspal-dist-key"
  - name: send_requests
    params:
      count: "${config.request_count}"
      concurrency: "${config.concurrency}"
      prompt: "${config.prompt}"
      key_pool: true
    assertions:
      error_rate_pct:
        promql: "${harness.inference_results.error_rate_pct}"
        expect: "< 5"
cleanup: automatic
