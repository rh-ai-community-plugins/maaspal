name: verify_subscription_rate_limit
previous_names: [rate_limit_validation, rate_limit_validation_existing_subscription]
title: "Is my subscription's rate limit enforced?"
summary: >-
  Sends traffic on one of your subscriptions and shows exactly how many
  tokens got through before MaaS started throttling — and that it stayed shut.
description: >-
  Creates an API key pinned to a subscription, then sends requests one at a
  time to one model until MaaS starts answering 429. Checks that throttling
  started at the configured token budget (not early, not with more than one
  request's worth of overshoot), that no request got through after it, and
  that Limitador itself recorded the denials. Use your own existing
  subscription (its limit and window are read from the cluster), or let the
  run create a temporary test subscription with a limit you choose.
category: "Rate limits"
kind: verify
order: 1
mutates: [api_keys]
requires: [target_model_name, target_model_namespace]
est_duration: "~1 min"
plan_template: >-
  Create 1 API key on ${subscription}, then send up to ${config.request_count}
  requests (one at a time) to ${model} and expect MaaS to start throttling at
  about ${config.token_limit} tokens per ${config.token_window}.
inputs:
  mode:
    label: "Subscription to test"
    choices: [existing, temporary]
    help: >-
      existing — one of your subscriptions, as configured on the cluster.
      temporary — this run creates a throwaway subscription with the limit
      below, and deletes it afterwards.
  subscription:
    label: "Subscription"
    show_if: {mode: existing}
  token_limit:
    label: "Token limit"
    help: "Filled in from the selected subscription's configured limit for this model."
    from_subscription: limit
  token_window:
    label: "Window"
    help: >-
      Filled in from the subscription. For a temporary subscription keep it
      long (e.g. 24h) so the budget can't refill mid-run.
    from_subscription: window
  request_count:
    label: "Max requests"
    help: "Upper bound — the run stops early once throttled. Must be enough to use up the token limit (~10–30 tokens per request on the simulator)."
  new_subscription_name: {advanced: true, show_if: {mode: temporary}}
  subscription_namespace: {advanced: true, show_if: {mode: temporary}}
  limitador_namespace:
    advanced: true
    from_model: http_route
    help: "The model's HTTPRoute — filled in from the selected model."
  spillover_tokens:
    advanced: true
    help: "How far past the limit the first 429 may land: one in-flight request's worth of tokens."
  stop_after_429s: {advanced: true}
  retries:
    advanced: true
    help: "OpenAI SDK automatic retries. Keep 0 here so a retry can't hide a 429 or land in a fresh window."
  metrics_max_wait_s: {advanced: true}
  prompt: {advanced: true}
config:
  mode: existing
  subscription: ""            # existing mode — name of the MaaSSubscription to test
  target_model_name: ""       # the MaaSModelRef's own name, e.g. "facebook-opt-125m-simulated"
  target_model_namespace: ""  # the namespace that MaaSModelRef lives in, e.g. "llm"
  token_limit: 100
  # In temporary mode, deliberately much longer than the run itself —
  # effectively "never resets during the test". A short window lets the
  # budget refill mid-run, which hides whether enforcement works at all
  # (confirmed live: sequential requests only generate ~30–40 tokens/s, so a
  # 1s/50-token budget never even gets exceeded).
  token_window: "24h"
  request_count: 60
  # Sequential on purpose: at most one request is ever in flight, so the only
  # possible overshoot past the budget is that one request's own tokens.
  concurrency: 1
  spillover_tokens: 100
  stop_after_429s: 5
  retries: 0
  new_subscription_name: "maaspal-rate-limit-test"
  subscription_namespace: "models-as-a-service"
  limitador_namespace: ""
  metrics_max_wait_s: 65
  prompt: "Hello, world!"
metrics_queries:
  limited_calls: 'sum(limited_calls{limitador_namespace="${config.limitador_namespace}"})'
verdict:
  pass: >-
    MaaS throttled you after ${harness.inference_results.tokens_before_first_429} tokens
    (configured ${config.token_limit} per ${config.token_window}) and nothing got through afterwards.
  fail: >-
    The rate limit did not behave as configured — first 429 after
    ${harness.inference_results.tokens_before_first_429} tokens, against a configured
    ${config.token_limit} per ${config.token_window}. Check the cards below for which part differed.
tasks:
  - name: apply_rate_limit_subscription
    when: {mode: temporary}
    params:
      new_subscription_name: "${config.new_subscription_name}"
      namespace: "${config.subscription_namespace}"
      model_name: "${config.target_model_name}"
      model_namespace: "${config.target_model_namespace}"
      token_limit: "${config.token_limit}"
      token_window: "${config.token_window}"
  - name: provision_api_key
    when: {mode: temporary}
    params:
      key_name: "maaspal-rate-key"
      subscription: "${config.new_subscription_name}"
    assertions:
      subscription_echo_match_count:
        label: "Key bound to the test subscription"
        promql: "${harness.key_provision_checks.subscription_echo_match_count}"
        expect: "== 1"
  - name: provision_api_key
    when: {mode: existing}
    params:
      key_name: "maaspal-rate-key"
      subscription: "${config.subscription}"
    assertions:
      subscription_echo_match_count:
        label: "Key bound to your subscription"
        description: "MaaS honoured the subscription we asked for instead of auto-selecting another."
        promql: "${harness.key_provision_checks.subscription_echo_match_count}"
        expect: "== 1"
  - name: send_requests
    params:
      # Always pin the exact model — /v1/models can list several, and
      # discovery's first-available fallback once silently hijacked this test.
      model: "${config.target_model_namespace}/${config.target_model_name}"
      count: "${config.request_count}"
      concurrency: "${config.concurrency}"
      prompt: "${config.prompt}"
      key_pool: true
      retries: "${config.retries}"
      stop_after_429s: "${config.stop_after_429s}"
    assertions:
      throttled_at_all:
        label: "MaaS throttled the burst"
        description: >-
          If this fails, the run never used up the budget — raise Max requests,
          or check the token limit really applies to this model.
        unit: "429s"
        promql: "${harness.inference_results.rate_limited_count}"
        expect: "> 0"
      tokens_before_first_429:
        label: "Tokens through before the first 429"
        description: "Should land between the configured limit and one request's worth past it."
        unit: "tokens"
        promql: "${harness.inference_results.tokens_before_first_429}"
        between: ["${config.token_limit}", "${config.token_limit} + ${config.spillover_tokens}"]
      limit_stays_closed:
        label: "Requests that succeeded after being throttled"
        description: "Once over budget, nothing should get through until the window resets."
        unit: "requests"
        promql: "${harness.inference_results.successes_after_first_429}"
        expect: "== 0"
      maas_denied_by_rate_limit:
        label: "Denials recorded by Limitador"
        description: >-
          Gateway-side confirmation (Limitador's limited_calls counter), not
          just the harness's own view. Waits for Prometheus to scrape.
        unit: "denials"
        promql: >-
          sum(limited_calls{limitador_namespace="${config.limitador_namespace}"})
          - ${baseline.limited_calls}
        expect: "> 0"
        max_wait_s: "${config.metrics_max_wait_s}"
cleanup: automatic
