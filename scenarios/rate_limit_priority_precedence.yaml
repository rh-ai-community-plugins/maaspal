name: rate_limit_priority_precedence
description: >-
  Priority-based subscription precedence — creates two MaaSSubscriptions
  eligible for the same caller identity (system:authenticated) with
  different priorities, then confirms auto-selection (no explicit
  `subscription` pinned) actually picks the higher-priority one, via the
  create response's echoed `subscription` field (see ADR-021). Confirmed live
  (this cluster): priority isn't arbitrated per-request — MaaS resolves it
  once, at key-creation time, deciding which subscription's rate limit a
  caller's key gets bound to.
category: "Rate Limiting"
config:
  subscription_namespace: "models-as-a-service"  # install-specific tenant namespace; override if yours differs
  target_model_name: ""       # required — the MaaSModelRef's own name, e.g. "facebook-opt-125m-simulated" (not the plain model id)
  target_model_namespace: ""  # required — the namespace that MaaSModelRef lives in, e.g. "llm"
  new_low_priority_subscription_name: "maaspal-priority-low"
  new_high_priority_subscription_name: "maaspal-priority-high"
  # Chosen to sit clearly outside the 100 default used elsewhere
  # (harness/tasks/subscription.py's _DEFAULT_PRIORITY), so this scenario's
  # outcome doesn't depend on whether rate_limit_validation/
  # subscription_without_authpolicy happen to be running concurrently.
  low_priority: 50
  high_priority: 200
  low_priority_token_limit: 10
  high_priority_token_limit: 1000000
  request_count: 10
  concurrency: 3
  prompt: "Hello, world!"
tasks:
  - name: apply_priority_test_subscriptions
    params:
      namespace: "${config.subscription_namespace}"
      model_name: "${config.target_model_name}"
      model_namespace: "${config.target_model_namespace}"
      subscriptions:
        - name: "${config.new_low_priority_subscription_name}"
          priority: "${config.low_priority}"
          token_limit: "${config.low_priority_token_limit}"
        - name: "${config.new_high_priority_subscription_name}"
          priority: "${config.high_priority}"
          token_limit: "${config.high_priority_token_limit}"
  - name: provision_api_key
    params:
      key_name: "maaspal-priority-key"
      # Deliberately NOT pinning `subscription` — auto-selection is exactly
      # what this scenario is testing. expect_subscription only checks the
      # outcome (ADR-021), it never influences the request.
      expect_subscription: "${config.new_high_priority_subscription_name}"
    assertions:
      expected_subscription_match_count:
        promql: "${harness.key_provision_checks.expected_subscription_match_count}"
        expect: "== 1"
  - name: send_requests
    params:
      # See rate_limit_validation.yaml for why this is required, not just
      # nice-to-have, once more than one model is registered on the cluster.
      model: "${config.target_model_namespace}/${config.target_model_name}"
      count: "${config.request_count}"
      concurrency: "${config.concurrency}"
      prompt: "${config.prompt}"
      key_pool: true
    # promql pass-through form (ADR-015) — see single_key_load.yaml. Lenient
    # on purpose: this scenario tests *which* subscription got selected, not
    # enforcement (see rate_limit_validation.yaml for that check) — a wrong
    # selection would already be caught above by expected_subscription_match_count.
    assertions:
      error_rate_pct:
        promql: "${harness.inference_results.error_rate_pct}"
        expect: "< 30"
cleanup: automatic
