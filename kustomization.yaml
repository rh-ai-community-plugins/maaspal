apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: maaspal

resources:
  - deploy/serviceaccount.yaml
  - deploy/rbac.yaml
  - deploy/rbac-monitoring.yaml
  - deploy/rbac-maas-readonly.yaml
  - deploy/rbac-maas-subscription-write.yaml
  - deploy/rbac-model-write.yaml
  - deploy/rbac-user-provisioning.yaml
  - deploy/pvc.yaml
  - deploy/configmap-global.yaml
  - deploy/deployment.yaml
  - deploy/service.yaml
  - deploy/route.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: maaspal-scenarios
    files:
      - scenarios/single_key_load.yaml
      - scenarios/multi_key_load.yaml
      - scenarios/direct_inference.yaml
      - scenarios/rate_limit_validation.yaml
      - scenarios/rate_limit_validation_existing_subscription.yaml
      - scenarios/metrics_fill.yaml
      - scenarios/subscription_without_authpolicy.yaml
      - scenarios/api_key_lifecycle.yaml
      - scenarios/rate_limit_priority_precedence.yaml
      - scenarios/platform_health_check.yaml
      - scenarios/model_health_check.yaml
      - scenarios/multi_model_subscription_spread.yaml
      - scenarios/multi_model_full_load.yaml
      - scenarios/rate_limit_shared_across_users.yaml
