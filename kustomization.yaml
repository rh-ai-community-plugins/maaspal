apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: maaspal

resources:
  - deploy/serviceaccount.yaml
  - deploy/rbac.yaml
  - deploy/rbac-monitoring.yaml
  - deploy/rbac-maas-readonly.yaml
  - deploy/rbac-maas-subscription-write.yaml
  - deploy/rbac-model-write.yaml
  - deploy/rbac-user-provisioning.yaml
  - deploy/pvc.yaml
  - deploy/configmap-global.yaml
  - deploy/deployment.yaml
  - deploy/service.yaml
  - deploy/route.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: maaspal-scenarios
    files:
      - scenarios/smoke_test.yaml
      - scenarios/verify_subscription.yaml
      - scenarios/verify_subscription_rate_limit.yaml
      - scenarios/keys_share_user_budget.yaml
      - scenarios/rate_limit_window_recovery.yaml
      - scenarios/subscription_auto_selection.yaml
      - scenarios/rate_limit_per_user_or_shared.yaml
      - scenarios/denied_without_auth_policy.yaml
      - scenarios/api_key_lifecycle.yaml
      - scenarios/usage_metrics_accuracy.yaml
      - scenarios/load_test.yaml
      - scenarios/gateway_overhead.yaml
      - scenarios/multi_model_load.yaml
      - scenarios/model_config_health.yaml
