apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: maaspal
  namespace: maaspal
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    # patch: Stop suspends the run's Job (spec.suspend) so it can't start a
    # replacement pod — see api/k8s.py:stop_run.
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maaspal
  namespace: maaspal
subjects:
  - kind: ServiceAccount
    name: maaspal
    namespace: maaspal
roleRef:
  kind: Role
  name: maaspal
  apiGroup: rbac.authorization.k8s.io
