apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "maaspal.fullname" . }}-data
  namespace: {{ include "maaspal.namespace" . }}
  labels:
    {{- include "maaspal.labels" . | nindent 4 }}
  annotations:
    # Run history survives `helm uninstall`; delete the PVC by hand to drop it.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.bff.persistence.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.bff.persistence.size }}
