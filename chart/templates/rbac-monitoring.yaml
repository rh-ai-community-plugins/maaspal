{{- if .Values.rbac.monitoring }}
# Grants the harness SA read access to OpenShift's in-cluster monitoring stack
# (Thanos Querier), needed to cross-validate MaaS metrics against Prometheus.
# See docs/architecture/adrs/ADR-014-maas-metrics-cross-validation.md.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "maaspal.clusterPrefix" . }}-monitoring-view
subjects:
  - kind: ServiceAccount
    name: {{ include "maaspal.serviceAccountName" . }}
    namespace: {{ include "maaspal.namespace" . }}
roleRef:
  kind: ClusterRole
  name: cluster-monitoring-view
  apiGroup: rbac.authorization.k8s.io
{{- end }}
