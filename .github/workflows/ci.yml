name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Frontend — typecheck, lint, tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  test-bff:
    runs-on: ubuntu-latest
    name: BFF + harness — ruff, mypy, pytest
    defaults:
      run:
        working-directory: bff
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bff/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check harness api

      - name: Mypy
        run: mypy harness api

      - name: Pytest
        run: pytest --tb=short

  lint-chart:
    runs-on: ubuntu-latest
    name: Helm chart — lint and render
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint
        run: helm lint chart/

      - name: Render (all optional grants on)
        run: helm template maaspal chart/ -n cp-maaspal --set rbac.userProvisioning=true --set access.groups[0]=admins > /dev/null
