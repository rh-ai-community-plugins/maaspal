name: api_key_lifecycle
title: "Do API keys behave correctly?"
summary: >-
  Keys come back as requested and can be found; revoking one stops it
  immediately without affecting the user's other keys.
description: >-
  Entirely through the MaaS REST API (/maas-api/v1/api-keys*), no Kubernetes
  reads or writes. Creates several keys and checks the create response echoes
  the requested name and carries an expiry date, that search finds them, and
  that they all work. Then revokes just one of them and checks the very next
  request with it is denied, that the other keys keep working, and that search
  no longer lists the revoked key as active.
category: "API keys"
kind: verify
mutates: [api_keys]
est_duration: "~30 s"
plan_template: >-
  Create ${config.key_count} API keys on ${subscription}, search for them, send
  ${config.request_count} requests, revoke 1 key, then check it's denied while the
  other ${config.key_count} − 1 keep working.
inputs:
  key_count:
    label: "Keys to create"
    help: "At least 2 — one gets revoked, the rest must keep working."
  request_count:
    label: "Requests per check"
  key_name:
    advanced: true
    help: "Name prefix for the keys this run creates — also what the search step looks for."
  concurrency:
    advanced: true
    help: "How many requests are in flight at the same time."
  prompt:
    advanced: true
    help: "The chat message sent in every request."
  request_api:
    label: "Request API"
    advanced: true
    choices: [chat_completions, completions, responses, embeddings]
    choice_labels:
      chat_completions: "/v1/chat/completions"
      completions: "/v1/completions"
      responses: "/v1/responses"
      embeddings: "/v1/embeddings"
    help: >-
      Which OpenAI-compatible endpoint the requests use. Embeddings only work
      on an embedding model.
  stream:
    label: "Streaming"
    advanced: true
    help: >-
      Stream each reply. Tokens are counted from the final usage chunk, and
      the time to the first token is reported.
  send_from_browser:
    label: "Send from user browser"
    advanced: true
    help: >-
      Send this run's requests from your browser straight to the MaaS gateway, the way an
      outside client would, instead of from the test pod inside the cluster. Keep this
      run's page open while it runs. If the gateway won't take calls from a browser, the
      step fails and says so — that is the result.
config:
  key_name: "maaspal-lifecycle-key"
  key_count: 3
  request_count: 6
  concurrency: 3
  prompt: "Hello, world!"
  request_api: chat_completions
  stream: false
  send_from_browser: true
verdict:
  pass: "API keys behaved correctly: revoking one key cut it off immediately and left the others working."
  fail: "Part of the API key lifecycle didn't behave as expected — see the failing step below."
tasks:
  - name: provision_api_key
    params:
      key_name: "${config.key_name}"
      count: "${config.key_count}"
    assertions:
      name_echo_match_count:
        label: "Keys returned with the requested name"
        unit: "keys"
        promql: "${harness.key_provision_checks.name_echo_match_count}"
        expect: "== ${config.key_count}"
      expires_at_present_count:
        label: "Keys with an expiry date"
        unit: "keys"
        promql: "${harness.key_provision_checks.expires_at_present_count}"
        expect: "== ${config.key_count}"
  - name: verify_api_key_search
    params:
      name_prefix: "${config.key_name}"
    assertions:
      found_count:
        label: "Keys found by search"
        unit: "keys"
        promql: "${harness.search_check.found_count}"
        expect: "== ${config.key_count}"
  - name: send_requests
    params:
      api: "${config.request_api}"
      stream: "${config.stream}"
      from_browser: "${config.send_from_browser}"
      count: "${config.request_count}"
      concurrency: "${config.concurrency}"
      prompt: "${config.prompt}"
      key_pool: true
    # Proves every key worked before revocation, so failures afterwards are
    # down to revocation, not keys that never worked.
    assertions:
      error_rate_before_revoke:
        label: "Error rate before revoking"
        unit: "%"
        promql: "${harness.inference_results.error_rate_pct}"
        expect: "< 5"
  - name: revoke_api_keys
    params:
      count: 1
  - name: verify_revoked_key_denied
    params:
      api: "${config.request_api}"
      stream: "${config.stream}"
      from_browser: "${config.send_from_browser}"
      count: "${config.request_count}"
      concurrency: "${config.concurrency}"
      prompt: "${config.prompt}"
      key_pool: true
      key_pool_filter: revoked
      result_key: "inference_results_revoked_key"
      retries: 0
    assertions:
      denied_after_revoke:
        label: "Requests with the revoked key denied (401/403)"
        unit: "requests"
        promql: "${harness.inference_results_revoked_key.unauthorized_count}"
        expect: "== ${config.request_count}"
  - name: verify_other_keys_still_work
    params:
      api: "${config.request_api}"
      stream: "${config.stream}"
      from_browser: "${config.send_from_browser}"
      count: "${config.request_count}"
      concurrency: "${config.concurrency}"
      prompt: "${config.prompt}"
      key_pool: true
      key_pool_filter: active
      result_key: "inference_results_other_keys"
    assertions:
      other_keys_error_rate:
        label: "Error rate on the keys that weren't revoked"
        unit: "%"
        promql: "${harness.inference_results_other_keys.error_rate_pct}"
        expect: "< 5"
  - name: verify_revoked_key_not_searchable
    params:
      name_prefix: "${config.key_name}"
    assertions:
      active_after_revoke:
        label: "Keys still listed as active"
        description: "The revoked key should drop out of the active-key search; the others stay."
        unit: "keys"
        promql: "${harness.search_check.found_count}"
        expect: "== ${config.key_count} - 1"
cleanup: automatic
