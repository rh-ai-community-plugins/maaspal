name: rate_limit_window_recovery
title: "Does access come back after the rate-limit window?"
summary: >-
  Uses up a small token budget, waits for its time window to pass, and checks
  requests succeed again — throttling should be temporary, not stuck.
description: >-
  Creates a temporary subscription with a small token limit over a short
  window (1 minute by default), sends requests until MaaS throttles, waits
  out the window plus a few seconds, then sends a few more — which should
  succeed. Uses its own subscription so the limit and window are known and
  short; your existing subscriptions are left alone.
category: "Rate limits"
kind: explore
mutates: [api_keys, subscriptions]
requires: [target_model_name, target_model_namespace]
est_duration: "~2 min"
plan_template: >-
  Create a temporary subscription allowing ${config.token_limit} tokens per
  ${config.token_window} on ${model}, send until throttled, wait ${config.token_window}
  + ${config.buffer_s}s, then send ${config.recovery_requests} more and expect access to be back.
inputs:
  target_model_name:
    label: "Model"
  token_window:
    label: "Window"
    help: >-
      How long a token budget lasts before it refills, e.g. 1m or 30s. The run
      waits this long after being throttled.
  recovery_requests:
    label: "Requests after the wait"
    help: "Keep this small — the refilled budget is the same small limit, so a long burst gets throttled again."
  token_limit:
    advanced: true
    help: "The temporary subscription's token limit — small, so it's used up in seconds."
  buffer_s:
    advanced: true
    help: "Extra seconds to wait on top of the window, so the check lands safely after the reset."
  new_subscription_name:
    advanced: true
    help: "Name of the temporary MaaSSubscription this run creates and deletes afterwards."
  subscription_namespace:
    advanced: true
    help: "Namespace MaaSSubscriptions live in on this cluster (the MaaS tenant namespace)."
  prompt:
    advanced: true
    help: "The chat message sent in every request."
  request_api:
    label: "Request API"
    advanced: true
    choices: [chat_completions, completions, responses, embeddings]
    choice_labels:
      chat_completions: "/v1/chat/completions"
      completions: "/v1/completions"
      responses: "/v1/responses"
      embeddings: "/v1/embeddings"
    help: >-
      Which OpenAI-compatible endpoint the requests use. Embeddings only work
      on an embedding model.
  stream:
    label: "Streaming"
    advanced: true
    help: >-
      Stream each reply. Tokens are counted from the final usage chunk, and
      the time to the first token is reported.
  send_from_browser:
    label: "Send from user browser"
    advanced: true
    help: >-
      Send this run's requests from your browser straight to the MaaS gateway, the way an
      outside client would, instead of from the test pod inside the cluster. Keep this
      run's page open while it runs. If the gateway won't take calls from a browser, the
      step fails and says so — that is the result. Not available yet for this scenario's sending until throttled.
config:
  target_model_name: ""
  target_model_namespace: ""
  token_window: "1m"
  recovery_requests: 3
  token_limit: 50
  buffer_s: 5
  new_subscription_name: "maaspal-window-recovery-test"
  subscription_namespace: "models-as-a-service"
  prompt: "Hello, world!"
  request_api: chat_completions
  stream: false
  send_from_browser: false
verdict:
  pass: >-
    Throttled after ${harness.inference_results.tokens_before_first_429} tokens, and once the
    ${config.token_window} window passed, ${harness.inference_results_after_window.success_count}
    of ${config.recovery_requests} requests succeeded again.
  fail: >-
    Access did not come back as expected after the ${config.token_window} window —
    ${harness.inference_results_after_window.success_count} of ${config.recovery_requests} requests
    succeeded after the wait.
tasks:
  - name: apply_rate_limit_subscription
    params:
      new_subscription_name: "${config.new_subscription_name}"
      namespace: "${config.subscription_namespace}"
      model_name: "${config.target_model_name}"
      model_namespace: "${config.target_model_namespace}"
      token_limit: "${config.token_limit}"
      token_window: "${config.token_window}"
  - name: provision_api_key
    params:
      key_name: "maaspal-recovery-key"
      subscription: "${config.new_subscription_name}"
  - name: send_requests
    params:
      api: "${config.request_api}"
      stream: "${config.stream}"
      from_browser: "${config.send_from_browser}"
      model: "${config.target_model_namespace}/${config.target_model_name}"
      concurrency: 1
      prompt: "${config.prompt}"
      key_pool: true
      # No SDK retries anywhere here: a hidden retry landing in the next
      # window is exactly the effect being measured.
      retries: 0
      until_throttled: true
      limit: "${config.token_limit}"
      window: "${config.token_window}"
      stop_after_429s: 2
      chart: true
      chart_group: "recovery"
      label: "Before the wait"
    assertions:
      throttled_at_all:
        label: "Budget used up (throttled)"
        description: "Precondition — recovery means nothing unless access was cut off first."
        unit: "429s"
        promql: "${harness.inference_results.rate_limited_count}"
        expect: "> 0"
  - name: pause
    params:
      duration_s: "${config.token_window}"
      buffer_s: "${config.buffer_s}"
      max_s: 900
      reason: "waiting for the rate-limit window to reset"
  - name: send_requests_after_window
    params:
      api: "${config.request_api}"
      stream: "${config.stream}"
      from_browser: "${config.send_from_browser}"
      model: "${config.target_model_namespace}/${config.target_model_name}"
      count: "${config.recovery_requests}"
      concurrency: 1
      prompt: "${config.prompt}"
      key_pool: true
      retries: 0
      result_key: "inference_results_after_window"
      chart: true
      chart_group: "recovery"
      label: "After the wait"
    assertions:
      recovered_success_count:
        label: "Requests that succeeded after the wait"
        description: >-
          At least the first should — later ones can legitimately be throttled
          again, since the refilled budget is small.
        unit: "requests"
        promql: "${harness.inference_results_after_window.success_count}"
        expect: "> 0"
cleanup: automatic
