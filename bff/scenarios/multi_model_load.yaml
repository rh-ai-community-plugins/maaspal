name: multi_model_load
previous_names: [multi_model_full_load, multi_model_subscription_spread]
title: "Does MaaS hold up with many models and subscriptions?"
summary: >-
  Stands up several throwaway models and subscriptions, spreads keys and
  traffic across all of them, and checks every combination keeps working.
description: >-
  Deploys N simulated models, grants access to them with one auth policy,
  creates M subscriptions randomly spread across the models, K API keys
  spread across the subscriptions, and R requests spread across the keys —
  each key sending to a model its subscription actually covers. Set Requests
  to 0 (and turn auto-cleanup off) to just stand the environment up for
  manual exploration in the MaaS overview page.
category: "Performance"
kind: explore
mutates: [api_keys, subscriptions, auth_policies, models]
needs_rbac: [model-write]
est_duration: "~3–5 min"
plan_template: >-
  Deploy ${config.model_count} models in ${config.model_namespace}, create
  ${config.subscription_count} subscriptions and ${config.api_key_count} API keys
  spread across them, then send ${config.request_count} requests across all keys.
inputs:
  model_count:
    label: "Models"
    help: "How many throwaway simulated models to deploy."
  subscription_count:
    label: "Subscriptions"
    help: "How many temporary subscriptions to create, each covering a random subset of the models."
  api_key_count:
    label: "API keys"
    help: "How many API keys to create, spread across the subscriptions."
  request_count:
    label: "Requests"
    help: "0 = just build the environment, send no traffic."
  concurrency:
    label: "Concurrent requests"
    help: "How many requests are in flight at the same time."
  model_namespace:
    advanced: true
    help: "Where to deploy the models. Must carry the maas.opendatahub.io/gateway-access label so MaaS's gateway accepts their routes."
  model_name_prefix:
    advanced: true
    help: "Name prefix for the throwaway models."
  subscription_name_prefix:
    advanced: true
    help: "Name prefix for the temporary subscriptions."
  subscription_namespace:
    advanced: true
    help: "Namespace MaaSSubscriptions (and auth policies) live in on this cluster — the MaaS tenant namespace."
  max_models_per_subscription: {advanced: true, help: "0 = no cap."}
  token_limit:
    advanced: true
    help: "Each subscription's token limit — generous by default so throttling doesn't count as failures here."
  model_ready_timeout:
    advanced: true
    help: "How long to wait for each model to start, in seconds."
  deploy_parallel:
    advanced: true
    help: "Deploy all models at once (faster) or one at a time (gentler on a small cluster)."
  token_rate_limit_ready_timeout:
    advanced: true
    help: "How long to wait, in seconds, for MaaS to finish generating each model's rate-limit policy before sending traffic."
  prompt:
    advanced: true
    help: "The chat message sent in every request."
  request_api:
    label: "Request API"
    advanced: true
    choices: [chat_completions, completions, responses, embeddings]
    choice_labels:
      chat_completions: "/v1/chat/completions"
      completions: "/v1/completions"
      responses: "/v1/responses"
      embeddings: "/v1/embeddings"
    help: >-
      Which OpenAI-compatible endpoint the requests use. Embeddings only work
      on an embedding model.
  stream:
    label: "Streaming"
    advanced: true
    help: >-
      Stream each reply. Tokens are counted from the final usage chunk, and
      the time to the first token is reported.
  send_from_browser:
    label: "Send from user browser"
    advanced: true
    help: >-
      Send this run's requests from your browser straight to the MaaS gateway, the way an
      outside client would, instead of from the test pod inside the cluster. Keep this
      run's page open while it runs. If the gateway won't take calls from a browser, the
      step fails and says so — that is the result.
config:
  model_count: 3
  model_name_prefix: "maaspal-sim"
  model_namespace: "${config.NAMESPACE}"
  subscription_count: 6
  subscription_name_prefix: "maaspal-dist-sub"
  subscription_namespace: "models-as-a-service"
  max_models_per_subscription: 0   # 0 = no cap
  token_limit: 1000000
  model_ready_timeout: 120         # seconds to wait for each model to become Ready
  deploy_parallel: true            # true = deploy all models concurrently; false = one at a time
  # Confirmed live: creating several subscriptions that share models races
  # the controller reconciling each shared model's TokenRateLimitPolicy
  # ("the object has been modified" conflicts) — this is how long to wait
  # for every referenced model's policy to actually report Accepted+Enforced
  # before moving on, not just for the subscription's own status.phase to be
  # set (see harness/tasks/subscription.py's
  # _wait_for_token_rate_limit_policies_ready).
  token_rate_limit_ready_timeout: 60
  api_key_count: 12
  request_count: 60
  concurrency: 10
  prompt: "Hello, world!"
  request_api: chat_completions
  stream: false
  send_from_browser: false
tasks:
  - name: deploy_simulated_model
    params:
      count: "${config.model_count}"
      name_prefix: "${config.model_name_prefix}"
      namespace: "${config.model_namespace}"
      ready_max_wait_s: "${config.model_ready_timeout}"
      parallel: "${config.deploy_parallel}"
  - name: apply_auth_policy
    params:
      # A MaaSSubscription only grants quota — gateway access is a separate
      # MaaSAuthPolicy, and provision_subscriptions_distributed never
      # creates one. Confirmed live: without this, every request to a
      # freshly-deployed model is denied regardless of subscription/quota,
      # matching what scenarios/subscription_without_authpolicy.yaml tests
      # deliberately — this scenario needs the opposite (real access), so it
      # grants the same owner_groups default subscriptions use.
      policy_name: "maaspal-dist-policy"
      namespace: "${config.subscription_namespace}"
      model_refs_from_shared_state: "deployed_models"
      subject_groups: ["system:authenticated"]
  - name: provision_subscriptions_distributed
    params:
      subscription_count: "${config.subscription_count}"
      name_prefix: "${config.subscription_name_prefix}"
      namespace: "${config.subscription_namespace}"
      max_models_per_subscription: "${config.max_models_per_subscription}"
      token_limit: "${config.token_limit}"
      token_rate_limit_ready_max_wait_s: "${config.token_rate_limit_ready_timeout}"
  - name: provision_keys_distributed
    params:
      key_count: "${config.api_key_count}"
      key_name_prefix: "maaspal-dist-key"
  - name: send_requests
    params:
      api: "${config.request_api}"
      stream: "${config.stream}"
      from_browser: "${config.send_from_browser}"
      count: "${config.request_count}"
      concurrency: "${config.concurrency}"
      prompt: "${config.prompt}"
      key_pool: true
      show_limit: false
    assertions:
      non_throttle_error_rate_pct:
        label: "Error rate (excluding throttling)"
        unit: "%"
        promql: "${harness.inference_results.non_throttle_error_rate_pct}"
        expect: "< 5"
cleanup: automatic
